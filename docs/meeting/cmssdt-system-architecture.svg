<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title description">
  <title id="title">CMSSDT Knowledge Graph Chatbot architecture</title>
  <desc id="description">Source data is imported into Neo4j and OpenSearch. The browser sends questions to the API, which uses deterministic queries or a read-only LLM fallback.</desc>
  <defs>
    <style>
      .title { font: 700 32px sans-serif; fill: #15233b; }
      .subtitle { font: 18px sans-serif; fill: #4a5c73; }
      .heading { font: 700 19px sans-serif; fill: #15233b; }
      .body { font: 16px sans-serif; fill: #25364d; }
      .small { font: 14px sans-serif; fill: #25364d; }
      .box { stroke-width: 2; rx: 12; }
      .arrow { stroke: #4e6785; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4e6785"/></marker>
  </defs>
  <rect width="1400" height="800" fill="#f7fafc"/>
  <text x="60" y="64" class="title">CMSSDT Knowledge Graph Chatbot</text>
  <text x="60" y="96" class="subtitle">Imported engineering facts, deterministic answers, and constrained LLM exploration</text>

  <text x="86" y="160" class="heading">Source data</text>
  <rect x="60" y="182" width="265" height="100" class="box" fill="#e9f7ef" stroke="#49a36a"/>
  <text x="82" y="217" class="heading">CMSSW build data</text>
  <text x="82" y="244" class="body">IBs, RelVals, unit tests,</text><text x="82" y="267" class="body">queue summaries</text>
  <rect x="60" y="310" width="265" height="100" class="box" fill="#fff4df" stroke="#d59820"/>
  <text x="82" y="345" class="heading">Clang log files</text>
  <text x="82" y="372" class="body">Diagnostics, files, packages,</text><text x="82" y="395" class="body">checkers and occurrences</text>
  <rect x="60" y="438" width="265" height="100" class="box" fill="#fcebed" stroke="#d76069"/>
  <text x="82" y="473" class="heading">GitHub export</text>
  <text x="82" y="500" class="body">PRs, Issues, comments, labels</text><text x="82" y="523" class="body">and textual references</text>

  <rect x="440" y="258" width="260" height="150" class="box" fill="#e8f1fb" stroke="#4687c8"/>
  <text x="462" y="298" class="heading">Incremental ingestion</text>
  <text x="462" y="327" class="body">Content hash checks</text><text x="462" y="351" class="body">Normalize and connect facts</text><text x="462" y="375" class="body">Replace changed sources only</text>
  <path d="M325 232 L440 294" class="arrow"/><path d="M325 360 L440 332" class="arrow"/><path d="M325 488 L440 372" class="arrow"/>

  <rect x="815" y="172" width="265" height="135" class="box" fill="#eaf4ee" stroke="#31905d"/>
  <text x="838" y="212" class="heading">Neo4j knowledge graph</text>
  <text x="838" y="241" class="body">Connected CMSSDT facts</text><text x="838" y="265" class="body">Sessions and feedback metadata</text>
  <rect x="815" y="360" width="265" height="105" class="box" fill="#fff4df" stroke="#d59820"/>
  <text x="838" y="400" class="heading">OpenSearch and archive</text>
  <text x="838" y="429" class="body">Optional log evidence retrieval</text>
  <path d="M700 306 L815 242" class="arrow"/><path d="M700 366 L815 409" class="arrow"/>

  <rect x="1145" y="95" width="205" height="110" class="box" fill="#eef2f7" stroke="#607086"/>
  <text x="1170" y="135" class="heading">Browser interface</text><text x="1170" y="164" class="body">Chat and history</text>
  <rect x="1145" y="278" width="205" height="160" class="box" fill="#e8f1fb" stroke="#4687c8"/>
  <text x="1170" y="318" class="heading">FastAPI service</text><text x="1170" y="347" class="body">Known fact routes first</text><text x="1170" y="371" class="body">Session persistence</text><text x="1170" y="395" class="body">Feedback verification</text>
  <rect x="1145" y="518" width="205" height="135" class="box" fill="#f4edf9" stroke="#8b68b5"/>
  <text x="1170" y="558" class="heading">LLM fallback</text><text x="1170" y="587" class="body">Read-only graph tools</text><text x="1170" y="611" class="body">No fact writes</text>
  <path d="M1248 205 L1248 278" class="arrow"/><path d="M1145 346 L1080 300" class="arrow"/><path d="M1145 390 L1080 409" class="arrow"/><path d="M1248 438 L1248 518" class="arrow"/><path d="M1145 585 L1080 278" class="arrow"/>

  <text x="60" y="730" class="small">Trust boundary: source records remain separate from chat and feedback metadata. Text matches provide discovery evidence, not proof of causality or a fix.</text>
</svg>