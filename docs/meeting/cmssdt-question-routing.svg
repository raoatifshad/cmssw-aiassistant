<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title description">
  <title id="title">CMSSDT question routing</title>
  <desc id="description">A user question is routed to a deterministic graph query when possible, otherwise to a constrained LLM that calls read-only graph tools.</desc>
  <defs>
    <style>
      .title { font: 700 30px sans-serif; fill: #15233b; }
      .text { font: 17px sans-serif; fill: #25364d; }
      .heading { font: 700 20px sans-serif; fill: #15233b; }
      .note { font: 15px sans-serif; fill: #4a5c73; }
      .box { stroke-width: 2; rx: 12; }
      .arrow { stroke: #4e6785; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4e6785"/></marker>
  </defs>
  <rect width="1400" height="620" fill="#f7fafc"/>
  <text x="60" y="58" class="title">How a question becomes a grounded answer</text>
  <rect x="60" y="128" width="230" height="105" class="box" fill="#eef2f7" stroke="#607086"/>
  <text x="85" y="169" class="heading">1. User question</text><text x="85" y="198" class="text">Browser sends POST /api/chat</text>
  <rect x="390" y="128" width="280" height="105" class="box" fill="#e8f1fb" stroke="#4687c8"/>
  <text x="415" y="169" class="heading">2. API routing</text><text x="415" y="198" class="text">Recognizes exact fact patterns</text>
  <path d="M290 180 L390 180" class="arrow"/>

  <rect x="770" y="88" width="290" height="130" class="box" fill="#e9f7ef" stroke="#49a36a"/>
  <text x="795" y="128" class="heading">3A. Deterministic route</text><text x="795" y="157" class="text">Focused Cypher query to Neo4j</text><text x="795" y="184" class="note">Example: latest primary IB or RelVal status</text>
  <path d="M670 160 L770 150" class="arrow"/>

  <rect x="770" y="340" width="290" height="145" class="box" fill="#f4edf9" stroke="#8b68b5"/>
  <text x="795" y="380" class="heading">3B. LLM fallback</text><text x="795" y="409" class="text">Restored chat context plus tools</text><text x="795" y="436" class="text">Maximum 8 tool-call rounds</text><text x="795" y="463" class="note">Tools are read-only</text>
  <path d="M530 233 L530 412 L770 412" class="arrow"/>

  <rect x="1155" y="148" width="185" height="115" class="box" fill="#eaf4ee" stroke="#31905d"/>
  <text x="1180" y="189" class="heading">4. Neo4j</text><text x="1180" y="218" class="text">Facts and links</text><text x="1180" y="242" class="note">Read-only queries</text>
  <path d="M1060 153 L1155 195" class="arrow"/><path d="M1060 412 L1155 235" class="arrow"/>

  <rect x="470" y="530" width="470" height="55" class="box" fill="#fff4df" stroke="#d59820"/>
  <text x="500" y="565" class="heading">5. Save user + assistant turns, return answer and citations</text>
  <path d="M915 218 L900 530" class="arrow"/><path d="M915 485 L900 530" class="arrow"/>

  <text x="60" y="300" class="note">Known questions avoid LLM interpretation. Broader questions may use the LLM, but it must retrieve graph evidence before answering.</text>
</svg>