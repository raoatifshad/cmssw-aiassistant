<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title description">
  <title id="title">CMSSDT Knowledge Graph Chatbot pipeline</title>
  <desc id="description">Source data flows through incremental ingestion into Neo4j, then to deterministic and LLM-assisted chat queries.</desc>
  <style>
    .title { font: 700 28px sans-serif; fill: #173b5c; }
    .subtitle { font: 14px sans-serif; fill: #617385; }
    .lane { font: 700 14px sans-serif; }
    .card-title { font: 700 15px sans-serif; fill: #1f2933; }
    .card-text { font: 13px sans-serif; fill: #526b7d; }
    .edge-label { font: 12px sans-serif; fill: #526b7d; }
  </style>
  <defs>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#72a46e"/></marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a788b7"/></marker>
    <marker id="teal-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087f78"/></marker>
    <marker id="gold-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d6b656"/></marker>
  </defs>

  <rect width="1400" height="690" fill="#ffffff"/>
  <text x="45" y="48" class="title">CMSSDT Knowledge Graph Chatbot</text>
  <text x="47" y="75" class="subtitle">Incremental CMSSW build data and GitHub evidence, retrieved through a Neo4j-backed chat API</text>

  <rect x="40" y="112" width="275" height="530" rx="10" fill="#f7fafc" stroke="#a9c3d8"/>
  <rect x="40" y="112" width="275" height="36" rx="10" fill="#e7f0f8"/>
  <text x="60" y="136" class="lane" fill="#275474">01  SOURCE DATA</text>
  <rect x="66" y="180" width="222" height="90" rx="6" fill="#ffffff" stroke="#5a9bc7" stroke-width="2"/>
  <text x="177" y="207" text-anchor="middle" class="card-title">cmsrepo/data</text>
  <text x="177" y="232" text-anchor="middle" class="card-text">Queue summaries, RelVals, unit tests</text>
  <text x="177" y="251" text-anchor="middle" class="card-text">and PR exports</text>
  <rect x="66" y="337" width="222" height="100" rx="6" fill="#ffffff" stroke="#5a9bc7" stroke-width="2"/>
  <text x="177" y="365" text-anchor="middle" class="card-title">Raw CMSSW GitHub export</text>
  <text x="177" y="390" text-anchor="middle" class="card-text">Issues, pull requests, comments, labels</text>
  <text x="177" y="409" text-anchor="middle" class="card-text">directory or tar archive</text>
  <rect x="66" y="505" width="222" height="75" rx="6" fill="#ffffff" stroke="#5a9bc7" stroke-width="2"/>
  <text x="177" y="533" text-anchor="middle" class="card-title">External Clang logs</text>
  <text x="177" y="557" text-anchor="middle" class="card-text">IB, architecture, and diagnostics</text>

  <rect x="350" y="112" width="320" height="530" rx="10" fill="#fbfcf9" stroke="#a7c394"/>
  <rect x="350" y="112" width="320" height="36" rx="10" fill="#e7f1df"/>
  <text x="370" y="136" class="lane" fill="#466c2c">02  INCREMENTAL INGESTION</text>
  <rect x="380" y="175" width="260" height="92" rx="8" fill="#ffffff" stroke="#72a46e" stroke-width="2"/>
  <text x="510" y="203" text-anchor="middle" class="card-title">ingestion/build_graph.py</text>
  <text x="510" y="228" text-anchor="middle" class="card-text">Hashes, normalizes, and reconciles sources</text>
  <rect x="380" y="320" width="260" height="70" rx="8" fill="#ffffff" stroke="#72a46e" stroke-width="2"/>
  <text x="510" y="347" text-anchor="middle" class="card-title">Build status</text>
  <text x="510" y="371" text-anchor="middle" class="card-text">Warnings and status per IB/architecture</text>
  <rect x="380" y="430" width="260" height="70" rx="8" fill="#ffffff" stroke="#72a46e" stroke-width="2"/>
  <text x="510" y="457" text-anchor="middle" class="card-title">GitHub import</text>
  <text x="510" y="481" text-anchor="middle" class="card-text">Items, comments, labels, references</text>
  <rect x="380" y="540" width="260" height="62" rx="8" fill="#ffffff" stroke="#72a46e" stroke-width="2"/>
  <text x="510" y="567" text-anchor="middle" class="card-title">Clang parser</text>
  <text x="510" y="588" text-anchor="middle" class="card-text">Diagnostic package and file facts</text>

  <rect x="705" y="112" width="325" height="530" rx="10" fill="#faf8fc" stroke="#a788b7"/>
  <rect x="705" y="112" width="325" height="36" rx="10" fill="#eae0f1"/>
  <text x="725" y="136" class="lane" fill="#67457a">03  NEO4J KNOWLEDGE GRAPH</text>
  <rect x="735" y="180" width="265" height="88" rx="8" fill="#ffffff" stroke="#a788b7" stroke-width="2"/>
  <text x="755" y="208" class="card-title">IB results and diagnostics</text>
  <text x="755" y="233" class="card-text">IB, RelVal, UnitTest, build status, Clang</text>
  <rect x="735" y="335" width="265" height="88" rx="8" fill="#ffffff" stroke="#a788b7" stroke-width="2"/>
  <text x="755" y="363" class="card-title">GitHub discussion facts</text>
  <text x="755" y="388" class="card-text">PR, Issue, comment, label, author</text>
  <rect x="735" y="490" width="265" height="76" rx="8" fill="#ffffff" stroke="#a788b7" stroke-width="2"/>
  <text x="755" y="518" class="card-title">Explicit textual references</text>
  <text x="755" y="543" class="card-text">Body/comment references to PRs or Issues</text>
  <rect x="735" y="592" width="265" height="33" rx="4" fill="#fff1ed" stroke="#e3a292"/>
  <text x="867" y="614" text-anchor="middle" class="edge-label" fill="#8e2b1f">References do not prove causality or a fix.</text>

  <rect x="1065" y="112" width="295" height="530" rx="10" fill="#fffdf7" stroke="#d9b85e"/>
  <rect x="1065" y="112" width="295" height="36" rx="10" fill="#fff1cc"/>
  <text x="1085" y="136" class="lane" fill="#876713">04  CHAT QUERY PATH</text>
  <rect x="1090" y="180" width="245" height="62" rx="8" fill="#ffffff" stroke="#d6b656" stroke-width="2"/>
  <text x="1212" y="207" text-anchor="middle" class="card-title">Browser or API client</text>
  <text x="1212" y="228" text-anchor="middle" class="card-text">POST /api/chat</text>
  <rect x="1090" y="305" width="245" height="84" rx="8" fill="#ffffff" stroke="#d6b656" stroke-width="2"/>
  <text x="1212" y="333" text-anchor="middle" class="card-title">Deterministic handlers</text>
  <text x="1212" y="358" text-anchor="middle" class="card-text">Build status, releases, PR/Issue evidence</text>
  <rect x="1090" y="452" width="245" height="72" rx="8" fill="#ffffff" stroke="#d6b656" stroke-width="2"/>
  <text x="1212" y="480" text-anchor="middle" class="card-title">LLM graph fallback</text>
  <text x="1212" y="504" text-anchor="middle" class="card-text">Read-only Cypher via graph tools</text>
  <rect x="1090" y="572" width="245" height="55" rx="4" fill="#fffbe8" stroke="#d6b656"/>
  <text x="1212" y="596" text-anchor="middle" class="card-title">Grounded response</text>
  <text x="1212" y="616" text-anchor="middle" class="card-text">Facts and evidence type stated</text>

  <path d="M288 225 H380" fill="none" stroke="#72a46e" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="332" y="214" text-anchor="middle" class="edge-label">CMSSW data</text>
  <path d="M288 387 H350 V465 H380" fill="none" stroke="#72a46e" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="329" y="450" text-anchor="middle" class="edge-label">GitHub export</text>
  <path d="M288 542 H350 V570 H380" fill="none" stroke="#72a46e" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M510 267 V320" fill="none" stroke="#72a46e" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M510 267 V430" fill="none" stroke="#72a46e" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M510 267 V540" fill="none" stroke="#72a46e" stroke-width="2" marker-end="url(#green-arrow)"/>
  <path d="M640 355 H690 V224 H735" fill="none" stroke="#a788b7" stroke-width="2" marker-end="url(#purple-arrow)"/>
  <path d="M640 465 H735" fill="none" stroke="#a788b7" stroke-width="2" marker-end="url(#purple-arrow)"/>
  <path d="M640 485 H690 V528 H735" fill="none" stroke="#a788b7" stroke-width="2" marker-end="url(#purple-arrow)"/>
  <path d="M640 570 H690 V250 H735" fill="none" stroke="#a788b7" stroke-width="2" marker-end="url(#purple-arrow)"/>
  <path d="M1212 242 V305" fill="none" stroke="#d6b656" stroke-width="2" marker-end="url(#gold-arrow)"/>
  <path d="M1090 347 H1045 V379 H1000" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#teal-arrow)"/>
  <text x="1045" y="367" text-anchor="middle" class="edge-label">graph lookup</text>
  <path d="M1212 389 V452" fill="none" stroke="#d6b656" stroke-width="2" marker-end="url(#gold-arrow)"/>
  <path d="M1090 488 H1045 V528 H1000" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#teal-arrow)"/>
  <path d="M1212 389 V572" fill="none" stroke="#087f78" stroke-width="2" marker-end="url(#teal-arrow)"/>
</svg>