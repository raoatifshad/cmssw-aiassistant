# The chatbot backend as it will run on the CERN VM: Neo4j + API (+ worker, later).
# Programs live in containers; ALL data lives under ${DATA_DIR} on the host, so
# containers can be deleted and recreated at any time without losing anything.
#
#   cd deploy/vm && cp .env.example .env   # fill in, never commit .env
#   podman compose -p ${PROJECT} up -d --build
#
# OpenSearch/Logstash are deliberately left out (2026-11-16): they only ever held
# one smoke-test event and no chat answer has used them; without OPENSEARCH_URL
# the API falls back to reading its archive files.
services:
  neo4j:
    image: docker.io/library/neo4j:5.26.29   # pinned: a dump loads cleanly into the same version
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env}/neo4j:/data:Z
      - ${DATA_DIR}/backups:/backups:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

  api:
    build:
      context: ../..            # the repo root, same Dockerfile as today
    restart: always
    env_file: .env              # LLM gateway, session secret, shifter settings
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      LOG_RAG_ARCHIVE_DIR: /data/log-rag
      CLANG_LOG_ROOT: /data/clang-logs
      TEST_LOG_RESULTS_DIR: /data/results   # where /api/test-logs/ingest will save files (later step)
    ports:
      - "${API_PORT:-8001}:8001"
    volumes:
      - ${DATA_DIR}/log-rag:/data/log-rag:Z
      - ${DATA_DIR}/clang-logs:/data/clang-logs:ro,Z
      - ${DATA_DIR}/results:/data/results:Z
    depends_on:
      neo4j:
        condition: service_healthy
